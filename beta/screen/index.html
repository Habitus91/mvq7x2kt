<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>실적분석 스크린모드</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* 화면 크기가 달라도 같은 비율로 보이게: 1rem = 16:9 화면 너비의 1% */
:root{font-size:min(1vw,1.7778vh);color-scheme:dark;
  --page:#0b1220;--surface:#131d30;--line:#26334a;--ink:#f1f5f9;--ink-2:#cbd5e1;--muted:#9fb0c7;
  --op:#3b82f6;--proc:#ea580c;--insp:#8b5cf6;--ok:#4ade80;--ng:#f87171;--warn:#fbbf24;--track:#1e2a40;
  --q0:#1a2538;--q1:#172554;--q2:#1e3a8a;--q3:#1d4ed8;--q4:#3b82f6}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:'Noto Sans KR','Malgun Gothic',sans-serif;overflow:hidden;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;word-break:keep-all}
body.idle{cursor:none}
#stage{width:100rem;height:56.25rem;position:relative;display:flex;flex-direction:column}
header{display:flex;align-items:baseline;gap:1.6rem;padding:2.2rem 3rem 1.4rem}
header h1{font-size:3rem;font-weight:800;letter-spacing:-.03em;line-height:1.15}
header p{font-size:1.5rem;color:var(--muted)}
.clock{position:absolute;right:3rem;top:2.5rem;z-index:3;font-size:2.6rem;font-weight:700;white-space:nowrap}
.clock small{font-size:1.5rem;font-weight:500;color:var(--muted);margin-right:.8rem}
#view{flex:1;min-height:0;position:relative;overflow:hidden}
.panel{position:absolute;inset:0;display:flex;flex-direction:column}
.sl{flex:1;min-height:0;padding:0 3rem;display:flex;flex-direction:column}
footer{padding:1.1rem 3rem 1.3rem;display:flex;align-items:center;gap:2rem;font-size:1.25rem;color:var(--muted)}
#dots{flex:1;display:flex;gap:.6rem}
#dots button{flex:1;height:2rem;background:none;border:0;padding:.75rem 0;cursor:pointer}
#dots i{display:block;height:.5rem;border-radius:.25rem;background:var(--track);overflow:hidden}
#dots b{display:block;height:100%;width:100%;background:var(--ink-2);transform:scaleX(0);transform-origin:left}
#dots .done b{transform:scaleX(1);opacity:.45}
#dots .on b{animation:fill linear forwards}
body.hold #dots .on b{animation-play-state:paused}
@keyframes fill{to{transform:scaleX(1)}}
#msg{color:var(--warn);font-weight:700}
#ctl{position:absolute;right:3rem;bottom:4.4rem;display:flex;gap:.6rem;transition:opacity .25s}
body.idle #ctl{opacity:0;pointer-events:none}
#ctl button{font:inherit;font-size:1.4rem;font-weight:700;color:var(--ink);background:#26334a;border:0;border-radius:.6rem;padding:.7rem 1.3rem;cursor:pointer}
#ctl button:hover{background:#33435f}
button:focus-visible{outline:.25rem solid #93c5fd;outline-offset:.15rem}
/* 공통 줄 */
.rows{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-start}
.r{display:grid;align-items:center;column-gap:1.6rem;flex:1;max-height:11.5rem;border-top:.1rem solid var(--line)}
.r.h{flex:none;border:0;font-size:1.5rem;color:var(--muted);padding-bottom:.6rem}
.r .n{text-align:right}
.r .c{font-size:2.5rem;font-weight:800;letter-spacing:-.02em}
.big{font-size:3.1rem;font-weight:800;letter-spacing:-.03em;line-height:1.1;white-space:nowrap}
.mid{font-size:2.2rem;font-weight:700;white-space:nowrap}
.sub{font-size:1.4rem;color:var(--muted);line-height:1.35;white-space:nowrap}
.ok{color:var(--ok);font-weight:700}.ng{color:var(--ng);font-weight:700}.none{color:var(--muted)}
.bar{height:2.6rem;display:flex;gap:.2rem;position:relative}
.bar i{display:block;min-width:.2rem}
.bar i:last-of-type{border-radius:0 .35rem .35rem 0}
.bar.t{background:var(--track);border-radius:.35rem;height:2rem}
.bar.t i{border-radius:.35rem}
.bar em{position:absolute;top:-.45rem;bottom:-.45rem;width:.25rem;margin-left:-.12rem;background:var(--ink);border-radius:.1rem}
.lg{display:flex;gap:2rem;font-size:1.5rem;color:var(--ink-2)}
.lg i{display:inline-block;width:1.2rem;height:1.2rem;border-radius:.25rem;margin-right:.6rem;vertical-align:-.1rem}
.lg i.tick{width:.25rem;margin:0 .9rem 0 .4rem;background:var(--ink)}
.two{flex:1;min-height:0;display:grid;grid-template-columns:1.15fr 1fr;gap:3.4rem}
.two>div{display:flex;flex-direction:column;min-height:0}
.two h2{font-size:1.9rem;font-weight:700;margin-bottom:1rem}.two h2 small{font-size:1.4rem;font-weight:500;color:var(--muted);margin-left:.8rem}
table{border-collapse:separate;border-spacing:.35rem;width:100%;flex:1;table-layout:fixed}
th{font-size:1.6rem;font-weight:500;color:var(--muted);height:2.6rem}
th.on{color:var(--ink);font-weight:800}
td{text-align:center;font-size:2.3rem;font-weight:700;border-radius:.4rem}
td.c{text-align:left;font-size:2.1rem;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.foot{font-size:1.3rem;color:var(--muted);padding-top:.8rem}

/* ── 움직임 (body.mv 일 때만) ── 화면 교체 = 판을 옆으로 밀기 · 줄은 차례로 등장 · 막대는 자라남 */
@keyframes inR{from{transform:translateX(100%)}}@keyframes outL{to{transform:translateX(-100%)}}
@keyframes inL{from{transform:translateX(-100%)}}@keyframes outR{to{transform:translateX(100%)}}
@keyframes up{from{opacity:0;transform:translateY(2.2rem)}}
@keyframes drop{from{opacity:0;transform:translateX(-4rem)}}
@keyframes grow{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes slideTick{from{left:0;opacity:0}}
@keyframes nudgeU{0%,100%{transform:none}50%{transform:translateY(-.35rem)}}
@keyframes nudgeD{0%,100%{transform:none}50%{transform:translateY(.35rem)}}
.mv .panel.inR{animation:inR .75s cubic-bezier(.22,.8,.24,1) both}.mv .panel.outL{animation:outL .75s cubic-bezier(.22,.8,.24,1) both}
.mv .panel.inL{animation:inL .75s cubic-bezier(.22,.8,.24,1) both}.mv .panel.outR{animation:outR .75s cubic-bezier(.22,.8,.24,1) both}
.mv #panel h1{animation:drop .7s .25s cubic-bezier(.2,.8,.2,1) both}.mv #panel header p{animation:drop .7s .35s cubic-bezier(.2,.8,.2,1) both}
.mv #panel .r:not(.h){animation:up .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.45s + var(--i,0)*.1s)}
.mv #panel .r .bar i{animation:grow 1.1s cubic-bezier(.2,.75,.2,1) both;animation-delay:calc(.75s + var(--i,0)*.1s)}
.mv #panel .r .bar i+i{animation-delay:calc(1.35s + var(--i,0)*.1s)}
.mv #panel .bar em{animation:slideTick 1.1s cubic-bezier(.2,.75,.2,1) both;animation-delay:calc(1s + var(--i,0)*.1s)}
.mv #panel.done,.mv #panel.done h1,.mv #panel.done header p,.mv #panel.done .r:not(.h),.mv #panel.done .r .bar i,.mv #panel.done .bar em{animation:none}
.arr{display:inline-block}.mv .ng .arr.u,.mv .ok .arr.u{animation:nudgeU 1.6s ease-in-out infinite}.mv .ng .arr.d,.mv .ok .arr.d{animation:nudgeD 1.6s ease-in-out infinite}
/* 읽는 줄 비추기 */
.r{position:relative}
.r::before{content:"";position:absolute;inset:.35rem -1.6rem;border-radius:.8rem;background:#1c2b47;opacity:0;transition:opacity .45s;z-index:-1}
.r.lit::before{opacity:1}.sl{position:relative;z-index:0}
/* 월별 경주 막대 */
.race{flex:1;min-height:0;position:relative}
.race .b{position:absolute;left:0;right:0;top:0;display:grid;grid-template-columns:12rem 1fr;column-gap:1.6rem;align-items:center}
.race .x{display:flex;align-items:center;gap:.2rem;height:100%}
.race .x i{display:block;height:62%;width:0}.race .x i:nth-child(2){border-radius:0 .5rem .5rem 0}
.race .x span{margin-left:1.2rem}
.mv .race .b{transition:transform var(--st) cubic-bezier(.45,.05,.25,1)}.mv .race .x i{transition:width var(--st) cubic-bezier(.45,.05,.25,1)}
.race .mo{position:absolute;right:0;bottom:0;font-size:11rem;font-weight:800;letter-spacing:-.05em;line-height:1;color:#33486d}
.steps{display:flex;gap:.8rem;padding:.2rem 0 1rem}
.steps span{flex:1;text-align:center;font-size:1.5rem;color:var(--muted);padding:.45rem 0;border-radius:.6rem;background:var(--surface);transition:background .4s,color .4s}
.steps span.on{background:var(--op);color:#fff;font-weight:800}
</style>
</head>
<body class="idle">
<main id="stage">
  <div class="clock"><small id="day"></small><span id="clk"></span></div>
  <div id="view"><section class="panel" id="panel"></section></div>
  <div id="ctl"><button id="bPrev">이전</button><button id="bHold">일시정지</button><button id="bNext">다음</button><button id="bFull">전체 화면</button><button id="bExit">나가기</button></div>
  <footer><div id="dots"></div><span id="msg"></span><span id="upd"></span></footer>
</main>

}
function total(s,c){ if(s.pr==null) return null; if(noInsp(c)) return r2(s.pr); return s.ir==null?null:+(r2(s.pr)+r2(s.ir)).toFixed(2); }
const by = (D,k,v) => { const o={}; D.forEach(r=>o[r[k]]=(o[r[k]]||0)+(+r[v]||0)); return Object.entries(o).filter(a=>a[1]>0).sort((a,b)=>b[1]-a[1]); };
const last = (R,k) => R.filter(r=>(+r[k]||0)>0).reduce((a,r)=>r['날짜']>a?r['날짜']:a,'');
const day = last(DATA.press,'생산수량'), iday = last(DATA.insp,'투입수'), mon = day.slice(0,7), mName = +mon.slice(5)+'월';
const months = [...new Set(DATA.press.filter(r=>+r['생산수량']>0).map(r=>r['날짜'].slice(0,7)))].sort();
const prev = months[months.indexOf(mon)-1];
const M = Object.fromEntries(items.map(c=>[c,stat(mon,c)]));
const diff = (a,b,d,good) => { if(a==null||b==null) return ''; const v=+(a-b).toFixed(d); return v===0?'같음':`<span class="${(v>0)===good?'ok':'ng'}"><span class="arr ${v>0?'u':'d'}">${v>0?'▲':'▼'}</span> ${Math.abs(v).toFixed(d)}%p</span>`; };

/* ── 장면 ── */
let SLIDES = [];
(function(){ // 1. 최근 생산일
  const R=items.map(c=>({c,s:stat(day,c)})).filter(a=>a.s.qty>0);
  const G='grid-template-columns:12rem 16rem 1fr 13rem 13rem';
  if(R.length) SLIDES.push({t:`${md(day)} 생산 실적`, s:'가장 최근에 생산한 날 · 생산한 품목만', h:()=>
    `<div class="rows"><div class="r h" style="${G}"><span>품목</span><span class="n">생산수량</span><span>설비 가동률</span><span class="n">공정 불량률</span><span>가장 긴 비가동</span></div>`+
    R.map(({c,s})=>{ const m=M[c], d=by(s.D,'비가동항목','시간(분)')[0];
      return `<div class="r" style="${G}"><span class="c">${c}</span><span class="n big">${fmt(s.qty)}<span class="mid">개</span></span>`+
       `<span style="display:grid;grid-template-columns:1fr 9.6rem;gap:1.2rem;align-items:center"><span class="bar t">${s.op==null?'':`<i style="width:${s.op*100}%;background:var(--op)"></i>`}${m.op==null?'':`<em style="left:${m.op*100}%"></em>`}</span><span class="big">${pc(s.op,1)}</span></span>`+
       `<span class="n"><div class="big">${pc(s.pr)}</div><div class="sub">이달 ${pc(m.pr)}</div></span>`+
       `<span>${d?`<div class="mid">${d[0]}</div><div class="sub">${fmt(d[1])}분</div>`:'<span class="mid none">없음</span>'}</span></div>`; }).join('')+
    `</div><div class="lg" style="padding-top:1rem"><span><i style="background:var(--op)"></i>이날 가동률</span><span><i class="tick"></i>이달 평균 가동률</span></div>`});
})();
(function(){ // 2. 이달 합산 불량률
  const R=items.map(c=>({c,s:M[c],t:total(M[c],c),p:prev?total(stat(prev,c),c):null}));
  const mx=Math.max(...R.map(a=>(a.s.pr?r2(a.s.pr):0)+(a.s.ir&&!noInsp(a.c)?r2(a.s.ir):0)),1), G='grid-template-columns:12rem 1fr 9rem 9rem 12rem 12rem';
  const seg=(v,k)=>v?`<i style="width:${r2(v)/mx*100}%;background:var(--${k})"></i>`:'';
  SLIDES.push({t:`${mName} 품목별 불량률`, s:`공정(시타발+외관불량) + 외관검사실 · LOSS 제외 · ${md(day)}까지`, h:()=>
    `<div class="lg" style="padding-bottom:.6rem"><span><i style="background:var(--proc)"></i>공정</span><span><i style="background:var(--insp)"></i>외관검사실</span></div>`+
    `<div class="rows"><div class="r h" style="${G}"><span>품목</span><span></span><span class="n">공정</span><span class="n">외관검사실</span><span class="n">합산</span><span class="n">${prev?+prev.slice(5)+'월 대비':''}</span></div>`+
    R.map(({c,s,t,p})=>`<div class="r" style="${G}"><span class="c">${c}</span><span class="bar">${seg(s.pr,'proc')}${noInsp(c)?'':seg(s.ir,'insp')}</span><span class="n mid">${pc(s.pr)}</span><span class="n mid">${noInsp(c)?'<span class="none" style="font-size:1.6rem">대상 아님</span>':pc(s.ir)}</span><span class="n big">${t==null?'–':t.toFixed(2)+'%'}</span><span class="n mid">${diff(t,p,2,false)}</span></div>`).join('')+`</div>`});
})();
(function(){ // 3. 이달 가동률 · 비가동 사유
  const R=items.map(c=>({c,s:M[c],q:prev?stat(prev,c):null})).filter(a=>a.s.work>0);
  const A=stat(mon), D=by(A.D,'비가동항목','시간(분)'), tot=D.reduce((a,b)=>a+b[1],0), top=D.slice(0,5);
  const G='grid-template-columns:11rem 1fr 9rem 9.5rem', H='grid-template-columns:8.5rem 1fr 8.5rem';
  if(R.length) SLIDES.push({t:`${mName} 설비 가동률`, s:`실가동 ÷ 근무시간 · ${md(day)}까지`, h:()=>`<div class="two"><div><h2>품목별 가동률${prev?`<small>오른쪽은 ${+prev.slice(5)}월 대비</small>`:''}</h2><div class="rows">`+
    R.map(({c,s,q})=>`<div class="r" style="${G}"><span class="c">${c}</span><span class="bar t"><i style="width:${s.op*100}%;background:var(--op)"></i></span><span class="n big" style="font-size:2.7rem">${pc(s.op,1)}</span><span class="n mid" style="font-size:1.9rem">${q&&q.op!=null?diff(s.op*100,q.op*100,1,true):''}</span></div>`).join('')+
    `</div></div><div><h2>비가동 사유 상위 5개<small>전체 품목 합계 ${fmt(tot)}분</small></h2><div class="rows">`+
    top.map(([k,v],i)=>`<div class="r" style="${H}"><span class="mid">${k}</span><span class="bar"><i style="width:${v/top[0][1]*100}%;background:${i<2?'var(--op)':'#40618f'}"></i></span><span class="n"><div class="mid">${fmt(v)}분</div><div class="sub">${Math.round(v/tot*100)}%</div></span></div>`).join('')+`</div></div></div>`});
})();
(function(){ // 4. 외관검사실
  if(!iday) return;
  const im=iday.slice(0,7), R=items.filter(c=>!noInsp(c)).map(c=>({c,s:stat(iday,c),m:stat(im,c)})).filter(a=>a.m.iq>0);
  const mx=Math.max(...R.map(a=>a.m.ir||0),.0001), G='grid-template-columns:12rem 14rem 10rem 1fr 9rem 14rem';
  SLIDES.push({t:`외관검사실 · ${md(iday)} 검사`, s:`검사일 기준 · 출하 샘플 제외`, h:()=>
    `<div class="rows"><div class="r h" style="${G}"><span>품목</span><span class="n">검사수량</span><span class="n">불량률</span><span></span><span class="n">${+im.slice(5)}월 불량률</span><span>${+im.slice(5)}월 가장 많은 불량</span></div>`+
    R.map(({c,s,m})=>{ const t=(DATA.inspTypes||[]).map(k=>[k,sum(m.I,k)]).filter(a=>a[1]>0).sort((a,b)=>b[1]-a[1])[0], tt=(DATA.inspTypes||[]).reduce((a,k)=>a+sum(m.I,k),0);
      return `<div class="r" style="${G}"><span class="c">${c}</span><span class="n">${s.iq?`<span class="big" style="font-size:2.7rem">${fmt(s.iq)}<span class="mid">개</span></span>`:'<span class="mid none" style="font-weight:500">검사 없음</span>'}</span><span class="n big">${s.iq?pc(s.ir):'<span class="none">–</span>'}</span><span class="bar" style="height:1.8rem"><i style="width:${m.ir/mx*100}%;background:var(--insp)"></i></span><span class="n mid">${pc(m.ir)}</span><span>${t?`<div class="mid">${t[0]}</div><div class="sub">${fmt(t[1])}개 · ${Math.round(t[1]/tt*100)}%</div>`:'–'}</span></div>`; }).join('')+
    `</div><div class="lg" style="padding-top:1rem"><span><i style="background:var(--insp)"></i>${+im.slice(5)}월 불량률</span></div>`});
})();
(function(){ // 5. 월별 합산 불량률: 달마다 막대가 자라고 순위가 바뀜
  const ms=months.slice(-8); if(ms.length<2) return;
  const V=ms.map(k=>items.map(c=>{const st=stat(k,c),t=total(st,c);return {c,t,pr:t==null?0:r2(st.pr),ir:t==null||noInsp(c)?0:r2(st.ir)};}));
  const mx=Math.max(...V.flat().map(v=>v.t||0)), H=100/items.length;
  const draw=(k,ani)=>{ const root=$('#panel .race'); if(!root) return;
    const rank=[...V[k]].sort((p,q)=>(q.t==null?-1:q.t)-(p.t==null?-1:p.t)).map(v=>v.c);
    V[k].forEach((v,i)=>{ const el=root.children[i]; el.dataset.rank=rank.indexOf(v.c); el.style.transform=`translateY(${rank.indexOf(v.c)*100}%)`;
      el.querySelectorAll('i')[0].style.width=v.pr/mx*80+'%'; el.querySelectorAll('i')[1].style.width=v.ir/mx*80+'%';
      const o=el.querySelector('.x span'), to=v.t==null?'–':v.t.toFixed(2)+'%'; ani?count(o,to,null,V.st*550):(o._n=(o._n||0)+1,o.textContent=to); });
    root.querySelector('.mo').textContent=+ms[k].slice(5)+'월';
    document.querySelectorAll('#panel .steps span').forEach((e,i)=>e.classList.toggle('on',i===k)); };
  SLIDES.push({t:'월별 합산 불량률 변화', s:`공정 + 외관검사실 · LOSS 제외 · 높은 순서 · ${md(day)}까지`, keep:true, h:()=>
    `<div class="lg" style="padding-bottom:.8rem"><span><i style="background:var(--proc)"></i>공정</span><span><i style="background:var(--insp)"></i>외관검사실</span></div>`+
    `<div class="steps">${ms.map(k=>`<span>${+k.slice(5)}월</span>`).join('')}</div>`+
    `<div class="race">${items.map(c=>`<div class="b" style="height:${H}%"><span style="font-size:2.5rem;font-weight:800;letter-spacing:-.02em">${c}</span><span class="x"><i style="background:var(--proc)"></i><i style="background:var(--insp)"></i><span class="big" style="font-size:2.6rem"></span></span></div>`).join('')}<div class="mo"></div></div>`,
    run:()=>{ const n=ms.length, st=Math.max(.5,Math.min(1.8,(SEC-5)/n)); V.st=st; $('#panel .race').style.setProperty('--st',st*.75+'s');
      if(!MV){ draw(n-1,false); return; }
      draw(0,false); for(let k=1;k<n;k++) later(()=>draw(k,true),(1+k*st)*1000); later(()=>draw(n-1,false),(1+n*st)*1000); }});
})();

/* ── 자동 전환 ── */
const Q=new URLSearchParams(location.search), SEC=Math.max(5,+Q.get('sec')||20), RESUME=60;
const MV = Q.get('motion')!=='off';   // 현장 모니터용이라 Windows '애니메이션 효과' 설정과 관계없이 움직임. 끄려면 ?motion=off
document.body.classList.toggle('mv',MV);
let cur=0, left=SEC, hold=0, reload=false, timers=[], tokens=0;
const later=(f,ms)=>timers.push(setTimeout(f,ms));
// 숫자 올라가기: 끝나면 반드시 원래 글자로 되돌림 (화면이 가려져 멈춰도 값은 맞음)
function count(el,text,from,T=1100){ const id=el._n=(el._n||0)+1;
  const m=text.match(/^(\D*)([\d,]+(?:\.\d+)?)(.*)$/s); if(!MV||!m){ el.textContent=text; return; }
  const to=+m[2].replace(/,/g,''), d=(m[2].split('.')[1]||'').length, cm=m[2].includes(','), cur0=from!=null?from:parseFloat((el.textContent.match(/[\d,]+(\.\d+)?/)||['0'])[0].replace(/,/g,''))||0, t0=performance.now(), my=tokens;
  const f=t=>{ if(my!==tokens||id!==el._n) return; const p=Math.max(0,Math.min(1,(t-t0)/T)), e=1-Math.pow(1-p,3), v=(cur0+(to-cur0)*e).toFixed(d); el.textContent=m[1]+(cm?Number(v).toLocaleString('ko-KR',{minimumFractionDigits:d}):v)+m[3]; if(p<1) requestAnimationFrame(f); };
  requestAnimationFrame(f); later(()=>{if(id===el._n) el.textContent=text;},T+200);
}
function show(i, fade, back){
  const sl=SLIDES[i=(i+SLIDES.length)%SLIDES.length]; cur=i; left=SEC; timers.forEach(clearTimeout); timers=[]; tokens++;
  document.querySelectorAll('.ghost').forEach(e=>e.remove());
  const old=$('#panel');
  if(fade&&MV&&old.children.length){ const g=old.cloneNode(true); g.removeAttribute('id'); g.className='panel ghost '+(back?'outR':'outL'); $('#view').prepend(g); later(()=>g.remove(),800); }
  const p=document.createElement('section'); p.id='panel'; p.className='panel'+(fade?(back?' inL':' inR'):'');
  p.innerHTML=`<header><div><h1 id="ttl">${sl.t}</h1><p id="stl">${sl.s}</p></div></header><div class="sl" id="slide">${sl.h()}</div>`; old.replaceWith(p);
  p.querySelectorAll('.rows').forEach(R=>[...R.querySelectorAll('.r:not(.h)')].forEach((e,k)=>e.style.setProperty('--i',k)));
  if(MV) p.querySelectorAll('.r .big,.r .mid').forEach(e=>{ // 숫자로 시작하는 첫 글자 조각만 (단위 글자는 그대로)
    const n=[...e.childNodes].find(x=>x.nodeType===3&&/^\s*[\d,]+(\.\d+)?%?(분|개)?$/.test(x.data)); if(!n) return;
    const w=document.createElement('span'), t=n.data; n.replaceWith(w); w.textContent=t.replace(/[\d,]+(\.\d+)?/,(m,d)=>(0).toFixed(d?d.length-1:0));
    const k=+(e.closest('.r').style.getPropertyValue('--i')||0); later(()=>count(w,t,0),700+k*100); later(()=>{w.textContent=t;},2600+k*100); });
  later(()=>p.classList.add('done'),4500);   // 등장이 끝나면 움직임을 떼어 내용이 반드시 보이게
  if(sl.run) sl.run();
  $('#dots').innerHTML=SLIDES.map((s,k)=>`<button class="${k===cur?'on':k<cur?'done':''}" data-k="${k}" aria-label="${k+1}번째 화면: ${s.t}"><i><b style="animation-duration:${SEC}s"></b></i></button>`).join('');
}
// 들어온 뒤 3초부터 끝나기 1초 전까지 한 줄씩 비춤
function light(){ if(!MV) return; const L=[...document.querySelectorAll('#panel .rows')]; const t=SEC-left;
  L.forEach(R=>{ const E=[...R.querySelectorAll('.r:not(.h)')], k=t<3||!E.length?-1:Math.floor((t-3)/Math.max(1,SEC-4)*E.length); E.forEach((e,i)=>e.classList.toggle('lit',i===k)); }); }
function setHold(n){ hold=n; document.body.classList.toggle('hold',n>0); $('#bHold').textContent=n>0?'계속':'일시정지'; note(); }
function go(d){ setHold(RESUME); show(cur+d,true,d<0); }
let off=false, mine=Date.parse(document.lastModified), check=()=>Promise.resolve(false);
// 새 데이터로 다시 불러오기: 그 순간 연결이 되는지 한 번 더 확인 (끊겼으면 지금 화면 유지)
// '전체 화면' 버튼을 쓴 상태에서 페이지를 새로 열면 전체 화면이 풀리므로, 그때는 새 데이터와 장면만 갈아 끼움
async function swap(){
  const r=await fetch(location.pathname+'?r='+Date.now(),{cache:'no-store'}); if(!r.ok) return;
  const t=await r.text(), a=t.indexOf('const DATA = '), b=t.indexOf('/* ── 자동 전환'); if(a<0||b<0) return;
  const n=new Function(t.slice(a,b)+';return {SLIDES,built:DATA.built};')(); if(!n.SLIDES.length) return;
  SLIDES=n.SLIDES; upd(n.built); mine=Date.parse(r.headers.get('Last-Modified')||'')||Date.now(); reload=false; show(0,true);
}
function refresh(){ check().then(ok=>{ if(!ok) return; if(document.fullscreenElement){ swap().catch(()=>{}); return; } location.replace(location.pathname+'?'+(Q.get('sec')?'sec='+SEC+'&':'')+(Q.get('motion')?'motion='+Q.get('motion')+'&':'')+'r='+Date.now()); }); }
function note(){ $('#msg').textContent = hold>0 ? `일시정지 · ${hold}초 뒤 다시 시작` : off ? '연결 끊김 · 마지막 화면 표시 중' : ''; }
function tick(){
  const n=new Date(); $('#day').textContent=`${n.getMonth()+1}월 ${n.getDate()}일(${WD[n.getDay()]})`; $('#clk').textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
  if(hold>0){ setHold(hold-1); return; }
  if(--left<=0){ if(cur===SLIDES.length-1 && reload) refresh(); show(cur+1,true); }
  light();
}
const upd=b=>$('#upd').textContent='데이터 갱신 '+b.slice(5).replace('-','/');
upd(DATA.built);
show(0,true); tick(); setInterval(tick,1000);

/* 조작: 마우스를 움직이면 버튼이 나타남(멈추지는 않음). 버튼·방향키를 쓰면 60초 멈춘 뒤 다시 돌아감 */
let idleT; addEventListener('pointermove',()=>{document.body.classList.remove('idle'); clearTimeout(idleT); idleT=setTimeout(()=>document.body.classList.add('idle'),4000);});
$('#bPrev').onclick=()=>go(-1); $('#bNext').onclick=()=>go(1); $('#bHold').onclick=()=>setHold(hold>0?0:RESUME);
$('#bFull').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});
$('#bExit').onclick=()=>{location.href='../press/';};
$('#dots').onclick=e=>{const b=e.target.closest('button'); if(b) {setHold(RESUME); show(+b.dataset.k,true,+b.dataset.k<cur);} };
addEventListener('keydown',e=>{ if(e.key==='ArrowRight') go(1); else if(e.key==='ArrowLeft') go(-1); else if(e.key===' '&&e.target===document.body) setHold(hold>0?0:RESUME); });

/* 화면 꺼짐 방지 (지원하는 브라우저만) */
async function wake(){ try{ if(navigator.wakeLock && document.visibilityState==='visible') await navigator.wakeLock.request('screen'); }catch(e){} }
wake(); document.addEventListener('visibilitychange',wake);

/* 5분마다 새 데이터 확인 -> 한 바퀴가 끝날 때 다시 불러옴. 끊기면 마지막 화면 유지 */
if(location.protocol.startsWith('http')){
  check=()=>fetch(location.pathname+'?check='+Date.now(),{method:'HEAD',cache:'no-store'}).then(r=>{ off=!r.ok; const v=Date.parse(r.headers.get('Last-Modified')||''); if(r.ok&&v&&mine&&v>mine+1000) reload=true; note(); return r.ok; }).catch(()=>{off=true;note();return false;});
  setInterval(check,5*60*1000); addEventListener('online',check); addEventListener('offline',()=>{off=true;note();});
}
</script>
</body>
</html>
